<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Netlify Forms detectie</title>
  </head>
  <body>
    <!--
      Dit verborgen bestand bestaat alleen zodat Netlify het contactformulier
      detecteert (SSR-gerenderde HTML wordt niet gescand). Niet verwijderen.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="naam" />
      <input type="email" name="email" />
      <input type="tel" name="telefoon" />
      <input type="text" name="dienst" />
      <textarea name="bericht"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
